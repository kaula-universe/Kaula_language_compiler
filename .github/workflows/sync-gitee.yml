name: Sync release snapshot to Gitee

# 目标：GitHub 发布 release / 新打 tag 时，自动把该 tag 的仓库快照 + release 产物同步到 Gitee。
# 提交路径：把本文件放到 GitHub 主仓 .github/workflows/sync-gitee.yml
# 说明：GitHub 的 release.yml 用 GITHUB_TOKEN 创建 release 不会触发本工作流的 release:published 事件，
#       因此本工作流以 push:tags 为主要触发器，并轮询等待 GitHub release（含产物）就绪后再同步。

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  # 手动补同步：填 tag 名称，用于回填历史版本
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. v1.0.195)'
        required: false
        default: ''

# 同一 tag 并发去重：release 和 push 事件可能同时触发
concurrency:
  group: gitee-sync-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  # Gitee 侧：组织 / 仓库名（按实际改）
  GITEE_OWNER: kaula-universe
  GITEE_REPO: kaula
  # Gitee 账号名（用于 HTTPS 认证：用户名:token，不能用 x-access-token）
  GITEE_USER: zhe116

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.tag }}"; fi
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          if [ -z "$TAG" ]; then echo "No tag resolved"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Syncing tag: $TAG"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 1

      - name: Build snapshot commit (no parent, full source tree)
        run: |
          git checkout --orphan kaula-snapshot
          git add -A
          git config user.name "kaula-sync-bot"
          git config user.email "bot@kaula.local"
          git commit -m "release $TAG (snapshot)"
          git tag -f "$TAG"

      - name: Push tag + snapshot to Gitee (force to drop full history)
        env:
          GITEE_USER: ${{ env.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git push --force "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" \
            "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Wait for GitHub release to be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml 仍在构建产物时 release 尚未发布；最多等待 40 分钟
          for i in $(seq 1 80); do
            RELEASE=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || true)
            if [ -n "$RELEASE" ]; then
              echo "$RELEASE" > /tmp/github_release.json
              echo "GitHub release ready for $TAG"
              exit 0
            fi
            sleep 30
          done
          echo "Timeout waiting for GitHub release $TAG" >&2
          exit 1

      - name: Sync GitHub release assets to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RELEASE=$(cat /tmp/github_release.json)
          # 在 Gitee 创建 release（tag 已强制推送，tag 必须先存在）
          GITEE_RELEASE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Released from ${GITHUB_REPOSITORY}\",\"access_token\":\"${GITEE_TOKEN}\"}")
          REL_ID=$(echo "$GITEE_RELEASE" | jq -r '.id')

          # 逐个下载 GitHub 附件并上传到 Gitee
          echo "$RELEASE" | jq -r '.assets[] | "\(.name)\t\(.browser_download_url)"' | while IFS=$'\t' read -r name url; do
            curl -sL -o "/tmp/$name" "$url"
            curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${REL_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@/tmp/$name" \
              && echo "uploaded: $name"
          done
