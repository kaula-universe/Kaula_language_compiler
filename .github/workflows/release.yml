name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang
        run: choco install llvm -y

      - name: Update version
        run: python scripts/version.py --update
        env:
          PYTHONIOENCODING: utf-8

      - name: Get version
        id: version
        run: |
          $version = python scripts/version.py --release
          $snapshot = python scripts/version.py --snapshot
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "snapshot=$snapshot" >> $env:GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Build
        run: python toolkit_build.py --release
        env:
          PYTHONIOENCODING: utf-8

      - name: Package
        run: python scripts/package_release.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaula-windows-x64
          path: release/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Update version
        run: python scripts/version.py --update
        env:
          PYTHONIOENCODING: utf-8

      - name: Get version
        id: version
        run: |
          echo "version=$(python scripts/version.py --release)" >> $GITHUB_OUTPUT
          echo "snapshot=$(python scripts/version.py --snapshot)" >> $GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Build
        run: python toolkit_build.py --release
        env:
          PYTHONIOENCODING: utf-8

      - name: Package
        run: python scripts/package_release.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaula-linux-x64
          path: release/*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version
        run: python scripts/version.py --update
        env:
          PYTHONIOENCODING: utf-8

      - name: Get version
        id: version
        run: |
          echo "version=$(python scripts/version.py --release)" >> $GITHUB_OUTPUT
          echo "snapshot=$(python scripts/version.py --snapshot)" >> $GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Build
        run: python toolkit_build.py --release
        env:
          PYTHONIOENCODING: utf-8

      - name: Package
        run: python scripts/package_release.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaula-macos-x64
          path: release/*.tar.gz

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        run: |
          echo "version=$(python scripts/version.py --release)" >> $GITHUB_OUTPUT
          echo "snapshot=$(python scripts/version.py --snapshot)" >> $GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Kaula ${{ steps.version.outputs.version }}
          body: |
            ## Kaula ${{ steps.version.outputs.version }}

            **Snapshot:** ${{ steps.version.outputs.snapshot }}

            ### Downloads
            - **Windows:** `kaula-${{ steps.version.outputs.version }}-windows-x64.zip`
            - **Linux:** `kaula-${{ steps.version.outputs.version }}-linux-x64.tar.gz`
            - **macOS:** `kaula-${{ steps.version.outputs.version }}-macos-x64.tar.gz`

            ### Installation
            ```bash
            # Extract and add to PATH
            # Windows
            unzip kaula-*.zip
            # Linux/macOS
            tar -xzf kaula-*.tar.gz
            ```
          files: |
            kaula-windows-x64/*.zip
            kaula-linux-x64/*.tar.gz
            kaula-macos-x64/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
