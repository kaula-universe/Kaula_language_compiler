name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang
        run: choco install llvm -y

      - name: Install NSIS
        run: choco install nsis -y

      - name: Update version
        run: python scripts/version.py --update
        env:
          PYTHONIOENCODING: utf-8

      - name: Get version
        id: version
        run: |
          $version = python scripts/version.py --release
          $snapshot = python scripts/version.py --snapshot
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "snapshot=$snapshot" >> $env:GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Build
        run: python toolkit_build.py --release
        env:
          PYTHONIOENCODING: utf-8

      - name: Test
        run: python scripts/run_tests.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Build NSIS installer
        run: |
          $version = python scripts/version.py --release
          $versionNoV = $version -replace "^v", ""
          $major = ($versionNoV -split "\.")[0]
          $minor = ($versionNoV -split "\.")[1]
          $patch = ($versionNoV -split "\.")[2]
          $env:KAULA_VERSION = $versionNoV
          $env:KAULA_VERSION_MAJOR = $major
          $env:KAULA_VERSION_MINOR = $minor
          $env:KAULA_VERSION_PATCH = $patch
          makensis /DPRODUCT_VERSION=$versionNoV scripts/installers/kaula.nsi
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaula-windows-x64
          path: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang dpkg-dev rpm

      - name: Update version
        run: python scripts/version.py --update
        env:
          PYTHONIOENCODING: utf-8

      - name: Get version
        id: version
        run: |
          echo "version=$(python scripts/version.py --release)" >> $GITHUB_OUTPUT
          echo "snapshot=$(python scripts/version.py --snapshot)" >> $GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Build
        run: python toolkit_build.py --release
        env:
          PYTHONIOENCODING: utf-8

      - name: Build .deb package
        run: python scripts/installers/build_deb.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Build .rpm package
        run: python scripts/installers/build_rpm.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaula-linux-x64
          path: |
            release/deb/*.deb
            release/rpm/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: brew install create-dmg

      - name: Update version
        run: python scripts/version.py --update
        env:
          PYTHONIOENCODING: utf-8

      - name: Get version
        id: version
        run: |
          echo "version=$(python scripts/version.py --release)" >> $GITHUB_OUTPUT
          echo "snapshot=$(python scripts/version.py --snapshot)" >> $GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Build
        run: python toolkit_build.py --release
        env:
          PYTHONIOENCODING: utf-8

      - name: Build .dmg
        run: python scripts/installers/build_dmg.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaula-macos-x64
          path: release/dmg/*.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find . -maxdepth 3 \( -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \) | while read f; do
            mv "$f" release/
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        run: |
          echo "version=$(python scripts/version.py --release)" >> $GITHUB_OUTPUT
          echo "snapshot=$(python scripts/version.py --snapshot)" >> $GITHUB_OUTPUT
        env:
          PYTHONIOENCODING: utf-8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Kaula ${{ steps.version.outputs.version }}
          body: |
            ## Kaula ${{ steps.version.outputs.version }}

            **Snapshot:** ${{ steps.version.outputs.snapshot }}

            ### Downloads

            #### Windows
            - **Installer (recommended):** `kaula-${{ steps.version.outputs.version }}-windows-x64.exe`
            - ZIP archive: `kaula-${{ steps.version.outputs.version }}-windows-x64.zip`

            #### Linux
            - **Debian/Ubuntu:** `kaula_${{ steps.version.outputs.version }}_amd64.deb`
            - **Fedora/RHEL:** `kaula-${{ steps.version.outputs.version }}-1.x86_64.rpm`
            - TAR archive: `kaula-${{ steps.version.outputs.version }}-linux-x64.tar.gz`

            #### macOS
            - **DMG (recommended):** `kaula-${{ steps.version.outputs.version }}-macos-x64.dmg`
            - TAR archive: `kaula-${{ steps.version.outputs.version }}-macos-x64.tar.gz`

            ### Installation

            #### Windows
            Run the `.exe` installer and follow the prompts. The installer adds Kaula to your PATH.

            #### Linux (Debian/Ubuntu)
            ```bash
            sudo dpkg -i kaula_*.deb
            sudo apt-get install -f  # if needed
            ```

            #### Linux (Fedora/RHEL)
            ```bash
            sudo rpm -i kaula-*.rpm
            ```

            #### macOS
            Open the `.dmg` and drag Kaula to Applications. Add `/Applications/Kaula.app/Contents/MacOS/bin` to your PATH.

            ### Verification
            ```bash
            kaulac --version
            ```
          files: |
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.dmg
            release/*.zip
            release/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
