name: Build on Tag

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Update version
        run: python scripts/version.py --update

      - name: Build compiler
        run: go build -o kaulac.exe ./compiler/cmd/kaulac