name: Build on Tag

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史：版本号由 git 总提交数减基准得出，浅克隆会算错
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Update version
        run: python scripts/version.py --update

      - name: Build compiler
        run: go build -o kaulac.exe ./compiler/cmd/kaulac