name: Diag Concurrency

# 临时诊断工作流：只在诊断分支上跑，用来把 Linux 并发用例的真实失败输出
# 以 check-run 注解（::error::）的形式暴露出来 —— 仓库的 job 原始日志
# 需要管理员权限才能下载，但注解是公开可读的。
#
# 诊断结束后本文件与 diag/* 分支一并删除。

on:
  push:
    branches: [ diag/conc ]

permissions:
  contents: read

jobs:
  diag:
    name: diag (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Env info
        run: |
          clang --version | head -1
          python3 --version
          echo "nofile=$(ulimit -n) ncpu=$(nproc)"

      - name: Build toolchain
        run: |
          python toolkit_build.py --release --target runtime
          python toolkit_build.py --release --target compiler
          python toolkit_build.py --release --target freestanding
          python toolkit_build.py --release --target std
          python toolkit_build.py --release --target headers
        env:
          PYTHONIOENCODING: utf-8

      - name: Concurrency tests (capture)
        run: |
          set +e
          python3 test/concurrency/run_tests.py > conc.log 2>&1
          rc=$?
          echo "===== exit=$rc ====="
          # 只抽取高信号行：失败汇总、编译/链接失败、断言失败、超时
          python3 - "$rc" <<'PY'
          import re
          import sys

          rc = sys.argv[1]
          try:
              raw = open('conc.log', encoding='utf-8', errors='replace').read()
          except OSError as exc:
              raw = f'<no log: {exc}>'

          lines = raw.splitlines()
          keep = []
          in_summary = False
          for ln in lines:
              if ln.startswith('失败：') or ln.startswith('全部通过'):
                  in_summary = True
              if in_summary:
                  keep.append(ln)
                  continue
              if ('编译/链接失败' in ln or 'kl 编译失败' in ln
                      or '[FAIL]' in ln or 'FAILED' in ln
                      or '[TIMEOUT]' in ln or 'error:' in ln
                      or 'multiple definition' in ln or 'undefined reference' in ln
                      or 'ASSERT' in ln or 'Segmentation' in ln):
                  keep.append(ln)

          body = '\n'.join(keep) if keep else '(no high-signal lines)'
          if len(body) > 55000:
              body = body[:55000] + '\n...[truncated]'

          def esc(s: str) -> str:
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')

          print(body)
          print(f'::error title=conc-exit-{rc}::{esc(body)}')
          PY
          exit $rc
