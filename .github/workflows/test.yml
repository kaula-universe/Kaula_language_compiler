name: Test

# The test corpus (test/*.kl) is the only thing standing between a language-level
# regression and a release. Two bugs reached v1.0.x because nothing ran it:
# chained calls a.b().c() were dropped by the parser, and interface methods
# returning an interface mis-parsed with errors on unrelated lines. This workflow
# runs the corpus on every push and PR so that cannot happen again.
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Clang
        run: choco install llvm -y

      - name: Build toolchain
        run: python toolkit_build.py --target std --target runtime --target headers
        env:
          PYTHONIOENCODING: utf-8

      - name: Build compiler
        run: python toolkit_build.py --target compiler
        env:
          PYTHONIOENCODING: utf-8

      # Fast gate: every program except the multi-second allocator benchmarks.
      - name: Test (quick)
        run: python scripts/run_tests.py --quick
        env:
          PYTHONIOENCODING: utf-8

      # Full gate including the slow multithreaded allocator stress tests.
      # These are correctness tests too, just slow, so they run on the main
      # branch and on tags but not on every PR.
      - name: Test (full, includes slow allocator stress)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python scripts/run_tests.py
        env:
          PYTHONIOENCODING: utf-8

  test-linux:
    name: test (linux, advisory)
    runs-on: ubuntu-latest
    # Advisory only: the corpus has never been run on Linux (src/ has _WIN32
    # paths, and the concurrency primitives were fixed for Windows first).
    # Kept non-blocking so it reports signal without turning CI red on day one.
    # Flip this to blocking once the log is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build toolchain
        run: python toolkit_build.py --target std --target runtime --target headers
        env:
          PYTHONIOENCODING: utf-8

      - name: Build compiler
        run: python toolkit_build.py --target compiler
        env:
          PYTHONIOENCODING: utf-8

      - name: Test (quick)
        run: python scripts/run_tests.py --quick
        env:
          PYTHONIOENCODING: utf-8
