name: Test

# The test corpus (test/*.kl) is the only thing standing between a language-level
# regression and a release. Two bugs reached v1.0.x because nothing ran it:
# chained calls a.b().c() were dropped by the parser, and interface methods
# returning an interface mis-parsed with errors on unrelated lines. This workflow
# runs the corpus on every push and PR so that cannot happen again.
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Clang
        run: choco install llvm -y

      - name: Build toolchain
        run: |
          python toolkit_build.py --target std
          python toolkit_build.py --target runtime
          python toolkit_build.py --target headers
        env:
          PYTHONIOENCODING: utf-8

      - name: Build compiler
        run: python toolkit_build.py --target compiler
        env:
          PYTHONIOENCODING: utf-8

      # Fast gate: every program except the multi-second allocator benchmarks.
      - name: Test (quick)
        run: python scripts/run_tests.py --quick
        env:
          PYTHONIOENCODING: utf-8

      # Full gate including the slow multithreaded allocator stress tests.
      # These are correctness tests too, just slow, so they run on the main
      # branch and on tags but not on every PR.
      - name: Test (full, includes slow allocator stress)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python scripts/run_tests.py
        env:
          PYTHONIOENCODING: utf-8

  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clang (toolchain + cross targets)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm qemu-system-x86 qemu-system-arm
          # Ubuntu 26.04（ubuntu-latest 当前镜像）起 qemu-system-riscv64 成了
          # virtual package，按旧包名直装报 "has no installation candidate"
          # 并 exit 100，整个 linux job 在装依赖阶段就挂掉。候选是
          # qemu-system-riscv / qemu-system-riscv-hwe。这里先按旧名装（兼容
          # 22.04 / 24.04 镜像），失败再装真实包名，不改变测试覆盖范围。
          sudo apt-get install -y qemu-system-riscv64 || sudo apt-get install -y qemu-system-riscv

      - name: Build toolchain
        run: |
          python toolkit_build.py --release --target runtime
          python toolkit_build.py --release --target compiler
          python toolkit_build.py --release --target freestanding
          python toolkit_build.py --release --target std
          python toolkit_build.py --release --target headers
        env:
          PYTHONIOENCODING: utf-8

      - name: Go unit tests
        run: cd compiler && go test ./...
        env:
          PYTHONIOENCODING: utf-8

      # 打包层的版本自述检查：介质必须带 version.json，kaulac --version 不得
      # 降级成 dev-local（v1.1.377 及之前所有安装包都中招）。
      - name: Installer packaging tests
        run: python3 test/installer_version_file_test.py --strict
        env:
          PYTHONIOENCODING: utf-8

      # 仓库卫生门禁：语料编译出的可执行文件没有扩展名，历史上漏过 50 个 ELF
      # 进仓库。这里按内容（魔数）检查索引，任何二进制构建产物直接判红。
      - name: Repository hygiene check (no compiled binaries)
        run: python3 scripts/check_no_binaries.py
        env:
          PYTHONIOENCODING: utf-8

      - name: C kernel concurrency tests (27)
        run: python3 test/concurrency/run_tests.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Freestanding tests (L1-L6)
        run: python3 scripts/run_freestanding_tests.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Standard library tests
        run: python3 scripts/run_tests.py
        env:
          PYTHONIOENCODING: utf-8
